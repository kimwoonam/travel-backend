# 공통 설정 (모든 환경에서 공통으로 사용)
spring.application.name=travel-backend

# JWT Configuration
jwt.expiration=${JWT_EXPIRATION:3600000}

# file allowed extension
file.upload.allowed.extension=${FILE_ALLOWED_EXTENSION:pdf,csv,txt}
file.upload.image.allowed.extension=${IMAGE_ALLOWED_EXTENSION:png,jpg,jpeg,gif}

# Rate Limiting
rate.limit.ms=${RATE_RETRY_AFTER:60}

# File Upload
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=travel:cache:

# JPA Query Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Actuator
management.info.env.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

