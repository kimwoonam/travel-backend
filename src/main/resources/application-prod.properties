# 프로덕션 환경 설정
server.port=${SERVER_PORT:8080}

# Security Configuration
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}

# DB (환경변수 필수)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# CORS (프로덕션 도메인만 허용)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://travel-app.com}

# JWT Configuration (환경변수 필수)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# UUID Crypto secret (환경변수 필수)
uuid.crypto.secret=${UUID_CRYPTO_SECRET}

# Redis (환경변수 필수)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.jedis.pool.max-active=20
spring.data.redis.jedis.pool.max-idle=10
spring.data.redis.jedis.pool.min-idle=5

# file upload path (환경변수 필수)
file.upload.path=${FILE_UPLOAD_PATH}
file.upload.image.path=${IMAGE_UPLOAD_PATH}
file.upload.thumbnail.path=${THUMBNAIL_UPLOAD_PATH}

# file allowed extension
file.upload.allowed.extension=${FILE_ALLOWED_EXTENSION:pdf,csv,txt}
file.upload.image.allowed.extension=${IMAGE_ALLOWED_EXTENSION:png,jpg,jpeg,gif}

# Actuator (제한적 노출)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.info.env.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# 로깅 설정
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=/var/log/travel-backend/${spring.application.name}.log
logging.level.root=WARN
logging.level.com.moodo.travel=INFO
logging.level.org.hibernate.SQL=WARN

# Rate Limiting
rate.limit.api.count=${RATE_LIMIT_API_COUNT:100}
rate.limit.auth.count=${RATE_LIMIT_AUTH_COUNT:10}
rate.limit.ms=${RATE_RETRY_AFTER:60}

# File Upload
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=travel:cache:

# JPA Query Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Swagger/OpenAPI (프로덕션에서는 비활성화)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

