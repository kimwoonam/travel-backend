# 개발 환경 설정
server.port=8080

# Security Configuration
server.ssl.enabled=false

# DB
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/travel}
spring.datasource.username=${DB_USER:travel}
spring.datasource.password=${DB_PASSWORD:travel}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# logging SQL Parameters view
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# CORS
app.cors.allowed-origins=http://127.0.0.1:5173,http://127.0.0.1:8080,http://localhost:5173,http://localhost:8080

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-secret-key-for-development-only}
jwt.expiration=${JWT_EXPIRATION:3600000}

# UUID Crypto secret
uuid.crypto.secret=${UUID_CRYPTO_SECRET:3056b4b7594382e0b67d1655fd942f5d}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# file upload path
file.upload.path=${FILE_UPLOAD_PATH:./upload/file/}
file.upload.image.path=${IMAGE_UPLOAD_PATH:./upload/image/}
file.upload.thumbnail.path=${THUMBNAIL_UPLOAD_PATH:./upload/thumbnail/}

# file allowed extension
file.upload.allowed.extension=${FILE_ALLOWED_EXTENSION:pdf,csv,txt}
file.upload.image.allowed.extension=${IMAGE_ALLOWED_EXTENSION:png,jpg,jpeg,gif}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics,swagger-ui
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# 로깅 설정
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/${spring.application.name}.log
logging.level.root=INFO
logging.level.com.moodo.travel=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Rate Limiting
rate.limit.api.count=100
rate.limit.auth.count=10
rate.limit.ms=60

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=travel:cache:

# JPA Query Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
