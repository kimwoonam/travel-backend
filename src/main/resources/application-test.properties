# 테스트 환경 설정
server.port=0

# DB (인메모리 또는 테스트 DB)
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway (테스트 환경에서는 비활성화)
spring.flyway.enabled=false

# Redis (테스트용)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Configuration
jwt.secret=test-secret-key-for-testing-only
jwt.expiration=3600000

# UUID Crypto secret
uuid.crypto.secret=test-uuid-secret-key-32bit

# file upload path
file.upload.path=./test-upload/file/
file.upload.image.path=./test-upload/image/
file.upload.thumbnail.path=./test-upload/thumbnail/

# 로깅 설정
logging.level.root=WARN
logging.level.com.moodo.travel=DEBUG

# Cache Configuration
spring.cache.type=simple

# Swagger/OpenAPI
springdoc.swagger-ui.enabled=false

