spring.application.name=travel-backend
server.port=8080
# DB
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/travel}
spring.datasource.username=${DB_USER:travel}
spring.datasource.password=${DB_PASSWORD:travel}
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# CORS
app.cors.allowed-origins=http://127.0.0.1:5173,http://127.0.0.1:8080,http://localhost:5173,http://localhost:8080
# JWT Configuration
jwt.secret=created-cursor-ai-travel-backend-secret-key
jwt.expiration=3600000
# UUID Crypto secret
uuid.crypto.secret=travel-app-uuid-secret-key-32bit
# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
