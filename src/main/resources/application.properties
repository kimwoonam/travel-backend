spring.application.name=travel-backend
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travel}
spring.datasource.username=${DB_USER:travel}
spring.datasource.password=${DB_PASSWORD:travel}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:8080}
# JWT Configuration
jwt.secret=created-cursor-ai-travel-backend-secret-key
jwt.expiration=3600000
# UUID Crypto secret
uuid.crypto.secret=travel-app-uuid-secret-key-32bit
# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379