spring.application.name=travel-backend
server.port=${SERVER_PORT:8080}

# Security Configuration
server.ssl.enabled=${SSL_ENABLED:false}
# DB
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/travel}
spring.datasource.username=${DB_USER:travel}
spring.datasource.password=${DB_PASSWORD:travel}
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# logging SQL Parameters view
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# CORS
app.cors.allowed-origins=http://127.0.0.1:5173,http://127.0.0.1:8080,http://localhost:5173,http://localhost:8080
# JWT Configuration
jwt.secret=${JWT_SECRET:created-cursor-ai-travel-backend-secret-key}
jwt.expiration=${JWT_EXPIRATION:3600000}
# UUID Crypto secret
uuid.crypto.secret=${UUID_CRYPTO_SECRET:travel-app-uuid-secret-key-32bit}
# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# file upload path
file.upload.path=${FILE_UPLOAD_PATH:/Users/xa03/travel-app/travel-backend/upload/file/}
# image file upload path
file.upload.image.path=${IMAGE_UPLOAD_PATH:/Users/xa03/travel-app/travel-backend/upload/image/}
# thumbnail file upload path
file.upload.thumbnail.path=${THUMBNAIL_UPLOAD_PATH:/Users/xa03/travel-app/travel-backend/upload/thumbnail/}
# file allowed extension
file.upload.allowed.extension=${FILE_ALLOWED_EXTENSION:pdf,csv,txt}
# image file allowed extension
file.upload.image.allowed.extension=${IMAGE_ALLOWED_EXTENSION:png,jpg,jpeg,gif}
# Actuator
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:when-authorized}
management.info.env.enabled=true

rate.limit.api.count=${RATE_LIMIT_API_COUNT:100}
rate.limit.auth.count=${RATE_LIMIT_AUTH_COUNT:10}
rate.limit.ms=${RATE_RETRY_AFTER:60}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}